name: ci

# Lint and offline unit tests. No cloud access.
on:
  push:
    branches-ignore: [main]
    paths: ["etl/**", "api/**", "injector/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["etl/**", "api/**", "injector/**", "pyproject.toml", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            etl/requirements-dev.txt
            api/requirements-dev.txt
      - run: pip install -r etl/requirements-dev.txt -r api/requirements-dev.txt -r injector/requirements.txt
      - run: ruff check etl api injector
      - run: ruff format --check etl api injector
      - run: pytest -q
